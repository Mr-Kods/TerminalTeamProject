worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;                     # внешний порт (туннель Cloud Pub)
        server_name  localhost;

        # Корневая папка проекта (все статические файлы)
        root   C:/Projects/Frontend;
        index  index.html;

        # 1. ЗАЩИТА: Запрещаем отдавать папки бэкенда, БД, секреты и служебные файлы
        location ^~ /backend/ {
            return 404;
        }

        location ~ /\.(env|git|vscode|idea) {
            return 404;
        }

        location ~* \.(py|pyc|db|sqlite|sqlite3|log|conf|md|txt)$ {
            return 404;
        }

        # 2. Роуты API и авторизации отправляем напрямую во Flask
        location ~ ^/(api|register|login|logout)/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Раздача статики (HTML, CSS, JS, изображения, шрифты)
        location / {
            try_files $uri $uri/ @flask;
        }

        # Все остальные динамические запросы уходят на Flask
        location @flask {
            proxy_pass http://127.0.0.1:5000;   # ваш Flask-сервер
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}